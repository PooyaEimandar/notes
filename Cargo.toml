[package]
name = "pooya-notes"
version = "0.1.0"
edition = "2024"
description = "Notes by Pooya Eimandar"
license = "MIT"
publish = false

[lib]
name = "pooya_notes"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25.1", features = ["derive"] }
sib = { git = "https://github.com/PooyaEimandar/sib", default-features = false, features = [
    "render",
] }

# The wasm-bindgen version has to match the wasm-bindgen CLI used by build.py.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3.103", features = [
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Window",
    "console",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
