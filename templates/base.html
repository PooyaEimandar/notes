<!doctype html>
<html lang="{{ lang }}" data-base="{{ base }}" data-build="{{ build }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010304">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{{ description }}">
  <meta name="author" content="{{ author }}">
  <meta name="robots" content="{{ robots }}">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:site_name" content="{{ site_title }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ social_image }}">
  <meta property="og:image:alt" content="{{ author }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ social_image }}">
  {{ head_extra }}
  <link rel="canonical" href="{{ canonical }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site_title }}" href="{{ base }}feed.xml">
  <link rel="stylesheet" href="{{ base }}assets/css/notes.css?v={{ build }}">
  <title>{{ title }}</title>
  <script type="application/ld+json">
{{ json_ld }}
  </script>
</head>

<body class="{{ body_class }}">
  <a class="skip-link" href="#content">Skip to the content</a>

  <header class="site-header" aria-label="Site header">
    <a class="wordmark" href="/" aria-label="Home">
      <span class="wordmark-name">{{ wordmark }}</span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
{{ nav }}
    </nav>
  </header>

{{ body }}

  <footer class="site-footer">
    <p>© {{ year }} <a href="{{ origin }}">{{ author }}</a>. All rights reserved.</p>
  </footer>
  {{ scripts }}
</body>

</html>
