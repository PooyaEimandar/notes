# Tag colours. A note's orb, and every "#tag" label, takes the colour of the tag.
# The orb uses the note's first tag.
#
# Language colours are GitHub's own, from github-linguist/linguist
# (lib/linguist/languages.yml). Topic colours are not defined by GitHub; edit
# them freely.

# Used for any tag that is not listed below.
default = "#56e8ff"

# Colours darker than this lightness (0..1) are lifted to it before display so
# they stay visible on the black background. The values below are not changed.
min_lightness = 0.6

[tags]
# Languages (GitHub linguist)
rust = "#dea584"
cpp = "#f34b7d"
